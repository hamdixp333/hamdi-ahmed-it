<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجرنا الإلكتروني</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #fafafa;
            color: #1a1a1a;
        }
        
        .container { max-width: 1200px; margin: 0 auto; padding: 2rem; }
        
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
        }
        
        .product-card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }
        .product-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
        }
        
        .product-image {
            height: 280px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            position: relative;
            overflow: hidden;
        }
        .product-image::after {
            content: 'صورة المنتج';
            position: absolute;
            inset: 0;
            display: flex; align-items: center; justify-content: center;
            color: rgba(255,255,255,0.8);
            font-size: 1.2rem;
        }
        .badge {
            position: absolute; top: 1rem; right: 1rem;
            background: #ef4444; color: white;
            padding: 0.4rem 1rem;
            border-radius: 20px;
            font-size: 0.85rem; font-weight: 700;
        }
        .wishlist {
            position: absolute; top: 1rem; left: 1rem;
            width: 40px; height: 40px;
            background: white; border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem;
            transition: 0.3s;
        }
        .wishlist:hover { background: #fee2e2; transform: scale(1.1); }
        
        .product-info { padding: 1.5rem; }
        .product-category {
            color: #6366f1;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }
        .product-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
            line-height: 1.4;
        }
        .product-rating {
            display: flex; align-items: center; gap: 0.5rem;
            margin-bottom: 1rem;
        }
        .stars { color: #fbbf24; }
        .reviews { color: #9ca3af; font-size: 0.9rem; }
        
        .product-footer {
            display: flex; justify-content: space-between; align-items: center;
            padding-top: 1rem;
            border-top: 1px solid #f3f4f6;
        }
        .price {
            display: flex; flex-direction: column;
        }
        .old-price {
            text-decoration: line-through;
            color: #9ca3af;
            font-size: 0.9rem;
        }
        .current-price {
            font-size: 1.5rem;
            font-weight: 800;
            color: #1a1a1a;
        }
        .add-to-cart {
            width: 50px; height: 50px;
            background: #1a1a1a; color: white;
            border: none; border-radius: 15px;
            cursor: pointer;
            font-size: 1.3rem;
            transition: all 0.3s;
        }
        .add-to-cart:hover {
            background: #6366f1;
            transform: scale(1.05) rotate(-5deg);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 style="text-align: center; margin-bottom: 3rem; font-size: 2.5rem;">منتجاتنا المميزة</h1>
        
        <div class="products-grid">
            <div class="product-card">
                <div class="product-image">
                    <span class="badge">خصم 20%</span>
                    <button class="wishlist">♡</button>
                </div>
                <div class="product-info">
                    <div class="product-category">إلكترونيات</div>
                    <h3 class="product-title">سماعات لاسلكية فاخرة مع إلغاء الضوضاء</h3>
                    <div class="product-rating">
                        <span class="stars">★★★★★</span>
                        <span class="reviews">(128 تقييم)</span>
                    </div>
                    <div class="product-footer">
                        <div class="price">
                            <span class="old-price">599 ر.س</span>
                            <span class="current-price">479 ر.س</span>
                        </div>
                        <button class="add-to-cart">+</button>
                    </div>
                </div>
            </div>
            
            <div class="product-card">
                <div class="product-image" style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);">
                    <button class="wishlist">♡</button>
                </div>
                <div class="product-info">
                    <div class="product-category">أزياء</div>
                    <h3 class="product-title">ساعة يد كلاسيكية فاخرة بإطار ذهبي</h3>
                    <div class="product-rating">
                        <span class="stars">★★★★☆</span>
                        <span class="reviews">(84 تقييم)</span>
                    </div>
                    <div class="product-footer">
                        <div class="price">
                            <span class="current-price">1,299 ر.س</span>
                        </div>
                        <button class="add-to-cart">+</button>
                    </div>
                </div>
            </div>
            
            <div class="product-card">
                <div class="product-image" style="background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);">
                    <span class="badge">جديد</span>
                    <button class="wishlist">♡</button>
                </div>
                <div class="product-info">
                    <div class="product-category">رياضة</div>
                    <h3 class="product-title">حذاء رياضي خفيف الوزن للجري</h3>
                    <div class="product-rating">
                        <span class="stars">★★★★★</span>
                        <span class="reviews">(256 تقييم)</span>
                    </div>
                    <div class="product-footer">
                        <div class="price">
                            <span class="old-price">450 ر.س</span>
                            <span class="current-price">349 ر.س</span>
                        </div>
                        <button class="add-to-cart">+</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
